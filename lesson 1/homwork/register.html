<!DOCTYPE html>
<html lang="en">
<head>
    <title>Registration</title>
</head>
<body>
  <div align="center">
  <div align ="center" class="border">
        <div  class="header">
            <h1 class="word">Registration</h1>
        </div>
        <h2 class="word">
            <form action="/register" method="POST">
                <div class="msg">{{msg}}</div>
                <input id="username" name="username" type="text" placeholder="Username"class='textbox' required></br></br>
                <input id="password" name="password" type="password" placeholder="Password" class='textbox' required></br></br>
                <input id="email" name="email" type="email" placeholder="Email" class='textbox' required></br></br>
                <input type="submit" value="Sign Up"class="btn"></br></br>
            </form>
        </h2>
        <p class="bottom">Already have an account? <a class="bottom" href="/login">Login</a></p>
    </div>  
</body>
</html>
